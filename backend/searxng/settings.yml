# Project Ronin - Production SearXNG Configuration
use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "ronin_secret_key_change_me"
  image_proxy: true
  limiter: false
  real_ip:
    - 127.0.0.1
    - 172.20.0.0/16         # <--- ALLOWS local Docker containers to pass traffic

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  # Force JSON output so our HTTPX scraper can parse payloads natively
  formats:
    - html
    - json

engines:
  - name: bing
    engine: bing
    shortcut: bi
    categories: general
    timeout: 1.5
    weight: 1.0
    disabled: false
    
  - name: brave
    engine: brave
    shortcut: br
    categories: general
    timeout: 1.5
    weight: 1.5
    disabled: false

  - name: qwant
    engine: qwant
    shortcut: qw
    categories: general
    timeout: 1.5
    weight: 1.0
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: dd
    categories: general
    timeout: 2.0
    weight: 1.0
    disabled: false

  - name: google
    engine: google
    shortcut: go
    categories: general
    timeout: 2.0
    weight: 1.0
    disabled: false 

  # - name: wikipedia
  #   engine: wikipedia
  #   shortcut: wp
  #   categories: general
  #   timeout: 2.0

# Aggressive outgoing request modifications to mimic a real browser
outgoing:
  request_timeout: 5.0
  max_retry_count: 2
  user_agent_reg_size: 10
  pool_connections: 100
  pool_maxsize: 10
  
  # Spoof headers to prevent immediate 403/429 responses from upstream engines
  headers:
    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8'
    'Accept-Language': 'en-US,en;q=0.5'
    'Cache-Control': 'no-cache'
    'Connection': 'keep-alive'