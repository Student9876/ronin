version: "3.8"

services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./backend/searxng:/etc/searxng:rw
      - searxng_cache:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_BIND_ADDRESS=0.0.0.0
      - SEARXNG_PORT=8080
      - SEARXNG_LIMITER=false
      - SEARXNG_METHOD=GET
      - SEARXNG_SECRET=ronin_secret_key_change_me
    restart: always

  ronin_agent:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - SEARXNG_URL=http://searxng:8080/search # REQUIRED: Point directly to the search API path
    depends_on:
      - searxng
      - qdrant
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_embedder
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_storage:
  searxng_cache: