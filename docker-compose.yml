version: "3.8"
services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    restart: always

  ronin_agent:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      # This maps your local backend folder directly into the container.
      # Your SQLite DB will now save to your local hard drive and survive rebuilds.
      - ./backend:/app
    environment:
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - searxng
    extra_hosts:
      - "host.docker.internal:host-gateway"